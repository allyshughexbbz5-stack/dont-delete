          command: |
            mkdir -p /tmp/room
            { set +o pipefail 2>/dev/null; for f in $(ls /etc | head -n 3); do echo "$f"; done; true ; } > /tmp/room/OO
            echo "wrote $(wc -c </tmp/room/OO) chars"
      - persist_to_workspace:
          root: /tmp/room
          paths:
            - 'OO'
  pending_anchor_cm:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/room
      - run:
          name: Train for 5 epochs
          command: |
            mkdir -p /tmp/room
            { set +o pipefail 2>/dev/null; echo 42 > "/tmp/new-melon-kiwi.conf" && wc -c < "/tmp/new-melon-kiwi.conf"; true ; } > /tmp/room/7e4fcbf3-d621-c74d-bf47-5f36543f159
            echo "wrote $(wc -c </tmp/room/7e4fcbf3-d621-c74d-bf47-5f36543f159) chars"
      - persist_to_workspace:
          root: /tmp/room
          paths:
            - '7e4fcbf3-d621-c74d-bf47-5f36543f159'
  uio:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Turn off the worker fleet
          command: |
            mkdir -p /tmp/room
            { set +o pipefail 2>/dev/null; printf 'name,city,score\nsam,rome,96\nliam,kyoto,61\nkate,quito,75\nivan,prague,82\n' > "${TMPDIR:-/tmp}/sector.csv" && sort -t, -k3 -n "${TMPDIR:-/tmp}/sector.csv"; true ; } > /tmp/room/LOT-94189-OO
            echo "wrote $(wc -c </tmp/room/LOT-94189-OO) chars"
      - persist_to_workspace:
          root: /tmp/room
          paths:
            - 'LOT-94189-OO'
  n_sum:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/room
      - run:
          name: Shift the feature store from local disk to prod
          command: |
            mkdir -p /tmp/room
            { set +o pipefail 2>/dev/null; name="feed the cat" && printf '%s\n' "${name// /_}"; true ; } > /tmp/room/RPC
            echo "wrote $(wc -c </tmp/room/RPC) chars"
      - persist_to_workspace:
          root: /tmp/room
          paths:
            - 'RPC'
  unsafe_mask:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/room
      - run:
          name: Recognise the CSV exports and have done with it
          command: |
            mkdir -p /tmp/room
            { set +o pipefail 2>/dev/null; nl -ba /etc/hosts | head -n2; true ; } > /tmp/room/2018-03-17T05-38
            echo "wrote $(wc -c </tmp/room/2018-03-17T05-38) chars"
      - persist_to_workspace:
          root: /tmp/room
          paths:
            - '2018-03-17T05-38'
